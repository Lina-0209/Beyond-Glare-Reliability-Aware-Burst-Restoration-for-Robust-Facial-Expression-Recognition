project_name: berr_lensglare4
seed: 42
output_root: outputs/berr

dataset:
  train_roots:
    celeb: data/lensglare4/celeb/train
    ffhq: data/lensglare4/ffhq/train
  val_roots:
    celeb: data/lensglare4/celeb/val
    ffhq: data/lensglare4/ffhq/val
  test_roots:
    celeb: data/lensglare4/celeb/test
    ffhq: data/lensglare4/ffhq/test
  image_size: 256
  roi_size: 128
  burst_length: 4
  strict_burst_length: true

model:
  roi_size: 128
  width: 32
  encoder_blocks: [2, 2, 4]
  decoder_blocks: [2, 2]
  reliability_temperature: 0.15
  use_offset_head: false
  max_residual_flow: 4.0
  feather_pixels: 3

loss_weights:
  roi: 1.0
  full: 0.5
  ssim: 0.2
  mask: 0.5
  visible: 0.25
  prior: 0.25
  outside: 0.2
  alignment: 0.1
  flow_smooth: 0.01

train:
  epochs: 40
  batch_size: 4
  num_workers: 4
  learning_rate: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  log_interval: 20

eval:
  batch_size: 4
  num_workers: 2
  max_batches: null

dry_run:
  num_samples: 8

